nodeLinker: node-modules

npmScopes:
  agv:
    npmAlwaysAuth: true
    npmAuthToken: "${CODEARTIFACT_AUTH_TOKEN}"
    npmPublishRegistry: "https://agv-000000000000.d.codeartifact.eu-central-1.amazonaws.com/npm/agv-node/"
    npmRegistryServer: "https://agv-000000000000.d.codeartifact.eu-central-1.amazonaws.com/npm/agv-node/"

plugins:
  - path: .yarn/plugins/@yarnpkg/plugin-typescript.cjs
    spec: "@yarnpkg/plugin-typescript"
  - path: .yarn/plugins/@yarnpkg/plugin-interactive-tools.cjs
    spec: "@yarnpkg/plugin-interactive-tools"

yarnPath: .yarn/releases/yarn-3.1.1.cjs
