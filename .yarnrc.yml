nodeLinker: node-modules

# Publishing goes to a private registry; the URL and token are injected by CI
# (see .github/workflows/npm-publish.yml). Plain installs need neither.
npmScopes:
  agv:
    npmAlwaysAuth: true
    npmAuthToken: "${CODEARTIFACT_AUTH_TOKEN:-}"
    npmPublishRegistry: "${AGV_NPM_REGISTRY:-https://registry.npmjs.org}"
    npmRegistryServer: "${AGV_NPM_REGISTRY:-https://registry.npmjs.org}"

plugins:
  - path: .yarn/plugins/@yarnpkg/plugin-typescript.cjs
    spec: "@yarnpkg/plugin-typescript"
  - path: .yarn/plugins/@yarnpkg/plugin-interactive-tools.cjs
    spec: "@yarnpkg/plugin-interactive-tools"

yarnPath: .yarn/releases/yarn-3.1.1.cjs
